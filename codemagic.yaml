workflows:
  ios-simulator:
    name: Riyadh Polo Hills - simulator checks
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: "26.4"
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: iOSApp
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Validate the Xcode project
        script: python3 ios/scripts/validate_project.py
      - name: Run native simulator tests
        script: bash ios/scripts/run_simulator_tests.sh
    artifacts:
      - ios/TestResults.xcresult
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: Riyadh Polo Hills - signed TestFlight deployment
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: Riyadh Polo Hills
    environment:
      xcode: "26.4"
      vars:
        # Public App Store Connect app identifier; signing credentials stay in the integration.
        APP_STORE_APPLE_ID: "6834111389"
        # Written to MARKETING_VERSION before tests and archiving; build number is automatic.
        APP_VERSION: "1.1.1"
        # Minutes: Apple can take longer than the CLI defaults to expose/process a build.
        APP_STORE_CONNECT_MAX_FIND_BUILD_WAIT: "30"
        APP_STORE_CONNECT_MAX_BUILD_PROCESSING_WAIT: "30"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.riyadhpolohills.academy
    # Start this workflow manually once the Apple app record and signing are ready.
    # A push validates the app through ios-simulator; it does not upload automatically.
    scripts:
      - name: Validate the Xcode project
        script: python3 ios/scripts/validate_project.py
      - name: Verify the Apple app record and set version and build number
        script: python3 ios/scripts/codemagic_prepare.py
      - name: Run native simulator tests before archiving
        script: bash ios/scripts/run_simulator_tests.sh
      - name: Apply Codemagic signing profiles
        script: xcode-project use-profiles --project ios/RiyadhPoloHills.xcodeproj
      - name: Archive and export the signed IPA
        script: |
          xcode-project build-ipa \
            --project ios/RiyadhPoloHills.xcodeproj \
            --scheme RiyadhPoloHills \
            --config Release
      - name: Validate the signed IPA with Apple
        script: |
          app-store-connect publish \
            --path "build/ios/ipa/*.ipa" \
            --enable-package-validation \
            --skip-package-upload
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/*.xcarchive/dSYMs/*.dSYM
      - ios/TestResults.xcresult
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  ios-app-store-status:
    name: Riyadh Polo Hills - App Store build status
    instance_type: mac_mini_m2
    max_build_duration: 10
    integrations:
      app_store_connect: Riyadh Polo Hills
    environment:
      xcode: "26.4"
      vars:
        APP_STORE_APPLE_ID: "6834111389"
    # Manual read-only check. No archive, signing, upload or review submission.
    scripts:
      - name: Read Apple build processing states
        script: python3 ios/scripts/codemagic_status.py
    artifacts:
      - /tmp/app-store-status.json
